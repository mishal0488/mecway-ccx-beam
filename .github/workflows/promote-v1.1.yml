name: Promote confirmed Mecway bridge v1.1

on:
  push:
    branches: [dev]
    paths:
      - 'bridge/releases/Mecway_CCX_v1_1_axis_fix.zip'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Extract confirmed v1.1 sources
        run: |
          rm -rf /tmp/mecway-v11
          mkdir -p /tmp/mecway-v11
          unzip -o bridge/releases/Mecway_CCX_v1_1_axis_fix.zip -d /tmp/mecway-v11
          cp /tmp/mecway-v11/bridge.py bridge/bridge.py
          cp /tmp/mecway-v11/mecway_launcher.py bridge/mecway_launcher.py
      - name: Update regression expectations for corrected profile axes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_bridge.py')
          s = p.read_text()
          s = s.replace(
              "            self.assertIn('0, -1,',text)\n"
              "            self.assertIn('-1, 0, 0',text)\n"
              "            self.assertIn('DO NOT SOLVE',text)",
              "            self.assertIn('0, 0, -1',text)\n"
              "            self.assertIn('0, 0, 1',text)\n"
              "            self.assertIn('MECWAY PROFILE AXIS FIX',text)"
          )
          s = s.replace(
              "OFFSET1=(0,0,0.1), OFFSET2=(0,0,0.1)",
              "OFFSET1=(0,0.1,0), OFFSET2=(0,0.1,0)"
          )
          s = s.replace(
              "# Beam along +X, default V=+Y, hence global +Z is local +W.",
              "# Mecway I-profile V/W is mapped to the UB31 y/z basis."
          )
          p.write_text(s)
          PY
      - name: Run bridge unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit promoted source
        run: |
          rm .github/workflows/promote-v1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/bridge.py bridge/mecway_launcher.py tests/test_bridge.py .github/workflows/promote-v1.1.yml
          git diff --cached --quiet || git commit -m "Promote confirmed Mecway bridge v1.1"
          git push origin dev
