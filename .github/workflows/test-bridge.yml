name: Test Mecway CCX Beam Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'bridge/**'
      - 'tests/**'
      - '.github/workflows/test-bridge.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bridge unit tests
        run: python -m unittest discover -s tests -v
